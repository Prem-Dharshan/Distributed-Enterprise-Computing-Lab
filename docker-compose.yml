services:
  library-service:
    build:
      context: ./library_service
    container_name: library-service
    ports:
      - "8011:8010"  # local:container
    volumes:
      - ./library_service:/app
    restart: always

  gateway-service:
    build:
      context: ./gateway_service
    container_name: gateway-service
    ports:
      - "8001:8000"  # local:container
    depends_on:
      - library-service
    volumes:
      - ./gateway_service:/app
    restart: always
